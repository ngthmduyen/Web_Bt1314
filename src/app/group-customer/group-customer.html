<p>group-customer works!</p>
<p style="color: red;">{{ errMessage }}</p>

<table border="1" cellspacing="0" cellpadding="5" style="width: 100%; border-collapse: collapse;">
  <thead>
    <tr style="background-color: #f2f2f2;">
      <th>Id</th>
      <th>Name</th>
      <th>Email</th>
      <th>Age</th>
      <th>#</th>
    </tr>
  </thead>

  <!-- Lặp từng nhóm khách hàng tạo thành một tbody -->
  <tbody *ngFor="let group of customerGroups">
    <!-- Hàng hiển thị tên nhóm -->
    <tr style="background-color: #e6f2ff; font-weight: bold;">
      <td colspan="5">
        {{ group.CustomerTypeId }} - {{ group.CustomerTypeName }}
      </td>
    </tr>

    <!-- Hàng lặp danh sách khách hàng trong nhóm -->
    <tr *ngFor="let cus of group.Customers">
      <td>{{ cus.Id }}</td>
      <td>{{ cus.Name }}</td>
      <td>{{ cus.Email }}</td>
      <td>{{ cus.Age }}</td>
      <td>
        <img [src]="cus.Image" [alt]="cus.Name" width="50" height="50" style="object-fit: cover;">
      </td>
    </tr>
  </tbody>
</table>
